<template id="01-tease-template">
  <div id="root" data-composition-id="01-tease" data-start="0" data-duration="4.6" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "Cormorant 01"; src: url("assets/fonts/cormorant-700.ttf") format("truetype"); font-weight: 700; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #root .t01-bg { position: absolute; inset: 0; background: #000000; }
      #root .t01-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 35%, #000 92%); pointer-events: none; }
      #root .t01-ember { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #ff8a3d; box-shadow: 0 0 27px #ff8a3d, 0 0 8px #CE5909; }
      #root .t01-lines { position: absolute; left: 0; right: 0; top: 42%; text-align: center;
        font-family: "Cormorant 01", Georgia, serif; font-weight: 700; font-size: 104px; line-height: 0.9;
        letter-spacing: -0.03em; text-transform: lowercase; color: #ffe7cf; }
      #root .t01-line { display: block; }
      #root .t01-w { display: inline-block; text-shadow: 0 0 23px #ff8a3d, 0 0 77px #ce590988; }
    </style>
    <div id="t01-bg" class="t01-bg clip" data-start="0" data-duration="4.6" data-track-index="0"></div>
    <div id="t01-ember-a" class="t01-ember clip" data-start="0" data-duration="4.6" data-track-index="1" style="left:1190px;top:0px"></div>
    <div id="t01-ember-b" class="t01-ember clip" data-start="0" data-duration="4.6" data-track-index="2" style="left:1267px;top:0px"></div>
    <div id="t01-lines" class="t01-lines clip" data-start="0" data-duration="4.6" data-track-index="3">
      <span class="t01-line"><span id="t01-w1" class="t01-w">every snack</span> <span id="t01-w2" class="t01-w">has been</span></span>
      <span class="t01-line"><span id="t01-w3" class="t01-w">waiting for this.</span></span>
    </div>
    <div id="t01-vig" class="t01-vig clip" data-start="0" data-duration="4.6" data-track-index="4"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        // Scene 1: ember drifts up from lower right
        tl.fromTo("#t01-ember-a", { y: 900, x: 0, scale: 1, opacity: 0.85 },
          { y: 380, x: -40, scale: 0.8, duration: 4, ease: "none" }, 0);
        // Scene 2: "every snack" blur-in with glow bloom, then "has been"
        tl.fromTo("#t01-w1", { opacity: 0, filter: "blur(14px)", scale: 1.04 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power2.out" }, 1.2);
        tl.fromTo("#t01-w2", { opacity: 0, filter: "blur(14px)", scale: 1.04 },
          { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "power2.out" }, 1.8);
        // Scene 3: prior lines dim to ~40%, final line blooms brighter
        tl.to(["#t01-w1", "#t01-w2"], { opacity: 0.4, duration: 0.6, ease: "power1.inOut" }, 2.4);
        tl.fromTo("#t01-w3", { opacity: 0, filter: "blur(16px) brightness(0.8)", scale: 1.05 },
          { opacity: 1, filter: "blur(0px) brightness(1.15)", scale: 1, duration: 0.9, ease: "power2.out" }, 2.4);
        // second ember rises during the hold
        tl.fromTo("#t01-ember-b", { y: 1000, opacity: 0, scale: 0.6 },
          { y: 700, x: 30, opacity: 0.6, scale: 0.5, duration: 1.6, ease: "none" }, 2.4);
        window.__timelines["01-tease"] = tl;
      })();
    </script>
  </div>
</template>
