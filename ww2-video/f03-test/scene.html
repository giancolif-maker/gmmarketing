<!doctype html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family: Fraktur; src: url(assets/fonts/fraktur.ttf); }
@font-face { font-family: Fell; src: url(assets/fonts/fell.ttf); }
@font-face { font-family: FellSC; src: url(assets/fonts/fellsc.ttf); }
@font-face { font-family: Elite; src: url(assets/fonts/elite.ttf); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e9dcc0; }
#stage { position: absolute; inset: 0; filter: sepia(.18) saturate(.92) contrast(1.03); }
#stage svg, #paper { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#paper { mix-blend-mode: multiply; pointer-events: none; }
#fade { position: absolute; inset: 0; background: #e6d6b4; opacity: 0; }
</style></head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- line boil: the displacement seed steps a few times a second so every ink line wobbles like hand-drawn cels -->
  <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="boilT" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="dof" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="9" stroke="#2a1c12" stroke-width="1.7"/></pattern>
  <pattern id="xhatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#2a1c12" stroke-width="1.5"/><line x1="0" y1="0" x2="10" y2="0" stroke="#2a1c12" stroke-width="1.1"/></pattern>
  <pattern id="damask" width="90" height="120" patternUnits="userSpaceOnUse">
    <rect width="90" height="120" fill="#b78a52"/>
    <path d="M45 14 C58 30 62 46 45 60 C28 46 32 30 45 14Z M45 60 C60 70 70 86 45 106 C20 86 30 70 45 60Z M0 60 C10 50 14 40 0 28 M90 60 C80 50 76 40 90 28" fill="#a7783f" stroke="#8f6331" stroke-width="2" opacity=".75"/>
    <circle cx="0" cy="0" r="6" fill="#a7783f"/><circle cx="90" cy="0" r="6" fill="#a7783f"/><circle cx="0" cy="120" r="6" fill="#a7783f"/><circle cx="90" cy="120" r="6" fill="#a7783f"/>
  </pattern>
  <pattern id="cobble" width="70" height="34" patternUnits="userSpaceOnUse">
    <rect width="70" height="34" fill="#7b6f63"/>
    <rect x="3" y="3" width="30" height="13" rx="6" fill="#8d8174" stroke="#2a1c12" stroke-width="2"/>
    <rect x="37" y="3" width="30" height="13" rx="6" fill="#857869" stroke="#2a1c12" stroke-width="2"/>
    <rect x="-15" y="19" width="30" height="13" rx="6" fill="#887b6d" stroke="#2a1c12" stroke-width="2"/>
    <rect x="20" y="19" width="30" height="13" rx="6" fill="#91857a" stroke="#2a1c12" stroke-width="2"/>
    <rect x="55" y="19" width="30" height="13" rx="6" fill="#887b6d" stroke="#2a1c12" stroke-width="2"/>
  </pattern>
  <radialGradient id="lampCone" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset=".6" stop-color="#ffcf7a" stop-opacity=".18"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="warmGlow"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc66b" stop-opacity=".35"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
  <radialGradient id="roomDark" cx="46%" cy="48%" r="75%"><stop offset=".35" stop-color="#20120a" stop-opacity="0"/><stop offset="1" stop-color="#20120a" stop-opacity=".62"/></radialGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55657a"/><stop offset=".55" stop-color="#b9876a"/><stop offset="1" stop-color="#e6b06a"/></linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222c3d"/><stop offset=".7" stop-color="#4c5465"/><stop offset="1" stop-color="#7c6d5c"/></linearGradient>
  <linearGradient id="skyRuhr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5446"/><stop offset=".5" stop-color="#c47a45"/><stop offset="1" stop-color="#ebba70"/></linearGradient>
  <linearGradient id="winNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26324a"/><stop offset="1" stop-color="#4d5a70"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6326"/><stop offset=".35" stop-color="#e8c26a"/><stop offset=".6" stop-color="#b8892f"/><stop offset="1" stop-color="#6e4c1c"/></linearGradient>
  <linearGradient id="shadeGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e5a3c"/><stop offset="1" stop-color="#6f9064"/></linearGradient>
  <clipPath id="cWin"><rect x="150" y="190" width="370" height="440"/></clipPath>
  <clipPath id="cMirror"><ellipse cx="1010" cy="400" rx="118" ry="150"/></clipPath>
</defs>
<g id="world" filter="url(#boil)"></g>
<g id="hud"></g>
</svg>
<img id="paper" src="build/paper.png">
<div id="fade"></div>
</div>
<script>
"use strict";
const INK = "#2a1c12";
const W = 1920, H = 1080, FPS = 30;
let TIMING = null, MOUTH = null;

// ---------- math ----------
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const E = {
  lin: u => u, io: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  out: u => 1 - Math.pow(1 - u, 3), in: u => u * u * u,
  back: u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  el: u => u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 9 - .75) * 2.094) + 1,
  step: u => u < 1 ? 0 : 1,
};
// keyframes [[time, value, ease]] — ease shapes the segment arriving at that key; values may be arrays
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1, e = "io"] = keys[i];
    const u = E[e](clamp((t - t0) / (t1 - t0)));
    return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], u)) : lerp(v0, v1, u);
  }
  return keys[keys.length - 1][1];
}
const wob = (t, s = 0, f = 1) => Math.sin(t * f * 1.3 + s) * .5 + Math.sin(t * f * 2.7 + s * 1.7) * .3 + Math.sin(t * f * 4.1 + s * 2.3) * .2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const f1 = n => +n.toFixed(1);

// blinks: a natural irregular schedule per character, plus forced blinks
function blink(t, seed, extra = []) {
  const r = rng(seed); let v = 0, ti = .5 + r() * 1.5;
  const ts = [...extra];
  while (ti < 40) { ts.push(ti); ti += 2.2 + r() * 2.6; }
  for (const b of ts) { const d = Math.abs(t - b - .06); v = Math.max(v, clamp(1 - (d - .025) / .055)); }
  return v;
}
// mouth openness for a speaker at time t (one frame of lead so lips anticipate the sound)
function mouth(who, t) {
  if (!MOUTH || !MOUTH[who]) return 0;
  const a = MOUTH[who], i = Math.round(t * FPS) + 1;
  const g = j => a[clamp(j, 0, a.length - 1)] || 0;
  return (g(i - 1) + 2 * g(i) + g(i + 1)) / 4;
}
const shapeAt = (t, o) => o < .15 ? "closed" : (Math.floor(t * 9) % 3 === 0 ? "oh" : o > .55 ? "open" : "ee");

// ---------- drawing helpers ----------
const S = (d, fill, sw = 5, extra = "") => `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const tx = (x, y, s, txt, fam, fill, extra = "") => `<text x="${x}" y="${y}" font-family="${fam}" font-size="${s}" fill="${fill}" ${extra}>${txt}</text>`;
// a two-segment tube limb; angle 0 points down, positive swings toward dir (+1 = +x)
function limb(sx, sy, a1, l1, a2, l2, col, w, dir = 1) {
  const r = Math.PI / 180;
  const ex = sx + dir * Math.sin(a1 * r) * l1, ey = sy + Math.cos(a1 * r) * l1;
  const hx = ex + dir * Math.sin((a1 + a2) * r) * l2, hy = ey + Math.cos((a1 + a2) * r) * l2;
  const d = `M${f1(sx)},${f1(sy)} Q${f1(ex)},${f1(ey)} ${f1((ex + hx) / 2)},${f1((ey + hy) / 2)} T${f1(hx)},${f1(hy)}`;
  return { svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 10}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`, hx, hy, ex, ey, ang: a1 + a2 };
}
function hand(x, y, skin, r = 15, finger = false, ang = 0, dir = 1) {
  let s = `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(-dir * ang)})">`;
  if (finger) s += S(`M${-4 * dir},-4 L${-4 * dir},-${r + 26} Q${2 * dir},-${r + 33} ${7 * dir},-${r + 26} L${7 * dir},-4Z`, skin, 4);
  s += `<ellipse cx="0" cy="0" rx="${r}" ry="${r * .9}" fill="${skin}" stroke="${INK}" stroke-width="4.5"/>`;
  s += S(`M${dir * r * .6},${-r * .5} q${dir * 10},-6 ${dir * 12},4`, "none", 4);
  return s + "</g>";
}
// eye with eyelid (lid 0 open .. 1 shut) and pupil look offset; id must be unique within the frame
function eye(id, cx, cy, rx, ry, lid, look, skin) {
  const ly = cy - ry + 2 * ry * clamp(lid);
  let s = `<clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/></clipPath>`;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fbf6ea"/>`;
  s += `<g clip-path="url(#${id})"><circle cx="${f1(cx + look[0] * rx * .45)}" cy="${f1(cy + look[1] * ry * .4 + 1)}" r="${f1(rx * .55)}" fill="${INK}"/>`;
  s += `<circle cx="${f1(cx + look[0] * rx * .45 - rx * .18)}" cy="${f1(cy + look[1] * ry * .4 - 2)}" r="${f1(rx * .16)}" fill="#fff"/>`;
  s += `<rect x="${cx - rx - 2}" y="${cy - ry - 2}" width="${2 * rx + 4}" height="${f1(ly - cy + ry + 2)}" fill="${skin}"/></g>`;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${INK}" stroke-width="3.2"/>`;
  s += `<path d="M${cx - rx - 1},${f1(ly)} Q${cx},${f1(ly + (lid > .95 ? 2 : -3))} ${cx + rx + 1},${f1(ly)}" fill="none" stroke="${INK}" stroke-width="${lid > .05 ? 4 : 0}" stroke-linecap="round"/>`;
  return s;
}
// mouth shapes driven by openness o; curve: + smile, - frown; skew: lop-sided smirk
function mouthSvg(cx, cy, w, o, shape, curve = 0, skew = 0) {
  let s = `<g transform="translate(${cx} ${cy})">`;
  if (shape === "closed" || o < .1) {
    s += `<path d="M${-w / 2},${-curve * .8 - skew} Q0,${curve + 2} ${w / 2},${-curve * .8 + skew}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`;
  } else {
    const ww = shape === "oh" ? w * .62 : shape === "ee" ? w * 1.08 : w, h = 5 + o * (shape === "ee" ? 15 : 27);
    s += `<path d="M${-ww / 2},${-curve * .5 - skew} Q0,${-3 - curve * .2} ${ww / 2},${-curve * .5 + skew} Q${ww * .3},${h} 0,${h} Q${-ww * .3},${h} ${-ww / 2},${-curve * .5 - skew}Z" fill="#4a1712" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    if (o > .28) s += `<path d="M${-ww * .32},0 Q0,-2 ${ww * .32},0 L${ww * .28},${Math.min(6, h * .3)} Q0,${Math.min(7, h * .32)} ${-ww * .28},${Math.min(6, h * .3)}Z" fill="#f6efe0"/>`;
    if (o > .4) s += `<ellipse cx="0" cy="${f1(h * .78)}" rx="${f1(ww * .26)}" ry="${f1(h * .2)}" fill="#b4544a"/>`;
  }
  return s + "</g>";
}
function cupSvg(x, y, tilt = 0, steam = 0, t = 0) {
  let s = `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(tilt)})">`;
  s += S("M-22,-30 L22,-30 L17,-2 Q0,4 -17,-2Z", "#f4efe2", 4) + S("M21,-24 q16,2 12,13 q-4,8 -14,6", "none", 4);
  s += `<path d="M-14,-20 L14,-20" stroke="#4f7a8a" stroke-width="3"/>`;
  if (steam > 0) for (let i = 0; i < 2; i++) { const p = (t * .7 + i * .5) % 1; s += `<path d="M${-6 + i * 12},${-36 - p * 40} q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" opacity="${f1(steam * (1 - p) * .8)}"/>`; }
  return s + "</g>";
}
function saucer(x, y) { return `<ellipse cx="${x}" cy="${y}" rx="40" ry="9" fill="#f4efe2" stroke="${INK}" stroke-width="4"/><ellipse cx="${x}" cy="${y - 2}" rx="18" ry="4" fill="none" stroke="${INK}" stroke-width="2"/>`; }

// 1923 banknote; v is the face value text
const NOTE_COLS = ["#d9c796", "#c9b27a", "#b9c39b", "#d8ad8c", "#c4b8a0"];
function note(x, y, w, h, rot, ci, v = "1.000.000", flip = 1) {
  const c = NOTE_COLS[ci % NOTE_COLS.length];
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(1 ${f1(flip)})">
    <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" fill="${c}" stroke="${INK}" stroke-width="3.5"/>
    <rect x="${-w / 2 + 6}" y="${-h / 2 + 6}" width="${w - 12}" height="${h - 12}" fill="none" stroke="#6b4c2c" stroke-width="2"/>
    <ellipse cx="${-w * .28}" cy="0" rx="${h * .24}" ry="${h * .3}" fill="none" stroke="#6b4c2c" stroke-width="2"/>
    ${w > 110 ? tx(w * .1, h * .1, h * .26, v, "Fell", "#3d2a18", 'text-anchor="middle"') + tx(w * .1, -h * .18, h * .14, "Reichsbanknote", "Fraktur", "#3d2a18", 'text-anchor="middle"') : ""}
  </g>`;
}

// ---------- characters ----------
const SKIN = "#edc7a0", SKIN_W = "#eab792";
// Herr Brandt, the customer: tall, thin clerk, bowler hat, round spectacles. Origin = seat (hip), faces +x.
function customer(P) {
  const { x, y, s = 1, o = 0, shape = "closed", curve = 1, bl = 0, lid = .12, brow = 0, browK = 0, look = [.4, 0], hr = 0, lean = 0, sq = 0,
    aR = [35, 75], aL = [25, 65], cup = false, cupTilt = 0, hat = 0, hatR = 0, rise = 0, legs = true, t = 0 } = P;
  const coat = "#4b4d58", coatD = "#33353e";
  let g = `<g transform="translate(${f1(x)} ${f1(y - rise * 80)}) scale(${s})">`;
  if (legs) {
    g += limb(0, -12, 88, 100, -88, 150, "#3a3a42", 44).svg;
    g += S("M86,140 q36,-8 52,6 q4,12 -14,12 l-40,0Z", "#1e1914", 4);
  }
  g += `<g transform="rotate(${f1(lean)}) scale(${f1(1 - sq * .06)} ${f1(1 + sq * .08)})">`;
  const L = limb(-6, -206, aL[0], 92, aL[1], 86, coatD, 28);
  g += L.svg + hand(L.hx, L.hy, "#d9ae88", 13);
  g += S("M-48,4 C-60,-90 -56,-180 -40,-222 Q0,-246 42,-226 C58,-170 62,-80 52,4 Q0,14 -48,4Z", coat);
  g += `<path d="M-44,-120 C-48,-60 -44,-20 -40,0 L-20,6 C-26,-50 -28,-110 -22,-200Z" fill="url(#hatch)" opacity=".45"/>`;
  g += S("M-2,-234 L20,-150 L40,-228Z", "#f1ead8", 4);
  g += S("M14,-226 L24,-226 L28,-166 L19,-152 L10,-166Z", "#7d2f25", 3.5);
  g += S("M-2,-234 L14,-178 L4,-150", "none", 4) + S("M40,-228 L28,-176 L36,-150", "none", 4);
  g += `<circle cx="30" cy="-120" r="4" fill="${INK}"/><circle cx="32" cy="-80" r="4" fill="${INK}"/>`;
  // head
  g += `<g transform="translate(12 -236) rotate(${f1(hr)})">`;
  g += S("M-10,6 L-8,-16 L16,-16 L18,6Z", SKIN, 4);
  g += S("M-34,-20 C-44,-60 -44,-112 -6,-124 C30,-130 52,-104 50,-60 C49,-36 44,-14 30,-4 C18,4 0,4 -12,-2 C-22,-6 -30,-12 -34,-20Z", SKIN);
  g += `<path d="M-34,-24 C-42,-60 -40,-96 -24,-114 C-30,-80 -28,-44 -18,-8Z" fill="#c99a74" opacity=".55"/>`;
  g += `<ellipse cx="-26" cy="-62" rx="9" ry="15" fill="${SKIN}" stroke="${INK}" stroke-width="4"/>`;
  g += S("M-38,-92 C-46,-66 -42,-44 -32,-34", "none", 9, 'stroke="#5e4a3a"');
  g += `<ellipse cx="38" cy="-44" rx="10" ry="6" fill="#d7765f" opacity=".35"/>`;
  g += eye("cEf", 6, -76, 7.5, 9.5, Math.max(lid, bl), look, SKIN) + eye("cEn", 33, -74, 8.5, 10.5, Math.max(lid, bl), look, SKIN);
  g += `<circle cx="6" cy="-76" r="15" fill="#fff" fill-opacity=".1" stroke="${INK}" stroke-width="3.5"/><circle cx="33" cy="-74" r="16" fill="#fff" fill-opacity=".1" stroke="${INK}" stroke-width="3.5"/>`;
  g += S("M21,-77 Q19,-82 17,-77", "none", 3) + S("M-9,-78 L-24,-70", "none", 3);
  const by = -98 - brow * 12;
  g += `<path d="M-6,${f1(by + browK * 4)} L16,${f1(by - browK * 3)}" stroke="#4a3a2c" stroke-width="5.5" stroke-linecap="round"/>`;
  g += `<path d="M24,${f1(by - browK * 3 + 1)} L46,${f1(by + browK * 5 + 2)}" stroke="#4a3a2c" stroke-width="6" stroke-linecap="round"/>`;
  g += S("M40,-72 C52,-58 62,-44 54,-38 C50,-34 42,-36 40,-40", SKIN, 4);
  g += mouthSvg(36, -20, 22, o, shape, curve);
  g += S(`M28,${f1(-31 - o * 3)} Q40,${f1(-28 - o * 3)} 52,${f1(-33 - o * 3)} Q46,${f1(-25 - o * 3)} 38,${f1(-26 - o * 3)} Q32,${f1(-26 - o * 3)} 28,${f1(-31 - o * 3)}Z`, "#5a4030", 2.5);
  // bowler hat
  g += `<g transform="translate(${f1(hat * 6)} ${f1(-hat * 75)}) rotate(${f1(hatR)} 4 -110)">`;
  g += S("M-42,-108 C-46,-162 44,-170 48,-110 Z", "#2c2723");
  g += `<path d="M-40,-118 C10,-112 30,-114 47,-120 L47,-109 C20,-104 -10,-104 -41,-108Z" fill="#6b2f26"/>`;
  g += `<ellipse cx="4" cy="-106" rx="64" ry="11" fill="#2c2723" stroke="${INK}" stroke-width="4"/>`;
  g += `<path d="M-14,-150 C-6,-160 12,-160 22,-152" fill="none" stroke="#6d6058" stroke-width="4" stroke-linecap="round"/></g>`;
  g += `</g>`;
  const R = limb(28, -212, aR[0], 96, aR[1], 88, coat, 30);
  g += R.svg;
  g += hand(R.hx, R.hy, SKIN, 15);
  if (cup) g += cupSvg(R.hx + 26, R.hy + 4, cupTilt, 0, t);
  g += `</g></g>`;
  return g;
}
// Otto, the waiter: stout, bald, handlebar moustache, waistcoat, long apron. Origin = feet, faces -x.
function waiter(P) {
  const { x, y, s = 1, o = 0, shape = "closed", curve = 0, skew = 0, bl = 0, lid = .45, brow = 0, browK = 0, look = [-.4, 0], hr = 0, lean = 0, sq = 0,
    aF = [12, 30], aB = [150, -70], finger = false, fingerAng = 0, tray = true, t = 0 } = P;
  const vest = "#2b2832";
  let g = `<g transform="translate(${f1(x)} ${f1(y)}) scale(${s})"><g transform="rotate(${f1(lean)}) scale(${f1(1 + sq * .07)} ${f1(1 - sq * .06)})">`;
  const B = limb(48, -392, aB[0], 88, aB[1], 80, "#f2ecdf", 32, -1);
  g += B.svg;
  if (tray) g += `<g transform="translate(${f1(B.hx)} ${f1(B.hy - 10)})"><ellipse cx="0" cy="0" rx="78" ry="13" fill="#b7b2a6" stroke="${INK}" stroke-width="4.5"/><ellipse cx="0" cy="-3" rx="62" ry="8" fill="#d8d3c6"/>${cupSvg(-20, -6, 0, 1, t)}${S("M24,-6 L50,-6 L44,-24 L30,-24Z", "#e9e0c9", 3.5)}</g>`;

    const rows = [["1913", "Einlage", "20.000"], ["1918", "Zinsen", "+ 1.840"], ["1921", "Einlage", "+ 5.000"], ["1923", "Guthaben", "26.840 M"]];
    rows.forEach(([y, l, v], i) => { b += `<g transform="rotate(${-3 + i * .2} 1360 500)">${tx(1170, 470 + i * 80, 34, y, "Elite", "#3d2a18")}${tx(1280, 470 + i * 80, 34, l, "Fell", "#3d2a18")}${tx(1600, 470 + i * 80, 34, v, "Elite", i === 3 ? "#8c2a1f" : "#3d2a18", 'text-anchor="end"')}<path d="M1160,${484 + i * 80} L1610,${470 + i * 80}" stroke="#a89878" stroke-width="2"/></g>`; });
    const ink = clamp((u - 1.1) / .6);
    b += `<g transform="rotate(-8 1380 700)" opacity="${f1(ink)}">${tx(1390, 760, 52, "wertlos", "Fraktur", "#8c2a1f", 'text-anchor="middle"')}<path d="M1240,${712} L1550,700" stroke="#8c2a1f" stroke-width="5"/></g>`;
    b += tx(790, 520, 30, "Sparkasse der Stadt Berlin", "Fell", "#3d2a18", 'text-anchor="middle" transform="rotate(4 800 520)"') + tx(790, 640, 40, "Herrn Bruno Brandt", "Fell", "#3d2a18", 'text-anchor="middle" font-style="italic" transform="rotate(4 800 640)"') + `<circle cx="760" cy="780" r="62" fill="none" stroke="#8c2a1f" stroke-width="5" opacity=".7"/>` + tx(760, 792, 24, "SPARKASSE", "FellSC", "#8c2a1f", 'text-anchor="middle" opacity=".7"');
    b += `<g transform="translate(330 1010) scale(2.2)">${saucer(0, 2)}${cupSvg(0, 0, 0, 0, t)}</g>`;
    b += `<circle cx="1000" cy="200" r="${f1(400 - u * 50)}" fill="url(#warmGlow)" opacity="${f1(.6 - u * .12)}" style="mix-blend-mode:screen"/>`;
    w += layer(1, b) + roomGrade(.9 + u * .05);
  }
  // date card on the street establishing shot
  if (sh.name === "street" && u > .5) {
    const p = clamp((u - .5) / .14), sc = lerp(1.9, 1, E.out(p)), [a, b] = shake(t, .6, 8);
    hud += `<g transform="translate(${1450 + a} ${180 + b}) rotate(-6) scale(${f1(sc)})" opacity="${f1(p * .92)}"><rect x="-260" y="-80" width="520" height="160" fill="none" stroke="#8c2a1f" stroke-width="9"/>${tx(0, -8, 46, "BERLIN", "FellSC", "#8c2a1f", 'text-anchor="middle" letter-spacing="10"')}${tx(0, 56, 58, "1923", "Elite", "#8c2a1f", 'text-anchor="middle" letter-spacing="8"')}</g>`;
  }
  if (sh.name === "ruhr" && u > .3) {
    const p = clamp((u - .3) / .14), sc = lerp(1.8, 1, E.out(p));
    hud += `<g transform="translate(420 170) rotate(4) scale(${f1(sc)})" opacity="${f1(p * .92)}"><rect x="-290" y="-70" width="580" height="140" fill="none" stroke="#8c2a1f" stroke-width="8"/>${tx(0, -6, 40, "THE RUHR", "FellSC", "#8c2a1f", 'text-anchor="middle" letter-spacing="8"')}${tx(0, 46, 32, "French occupation · January 1923", "Fell", "#8c2a1f", 'text-anchor="middle"')}</g>`;
  }
  document.getElementById("world").innerHTML = w;
  document.getElementById("hud").innerHTML = hud;
  const D = TIMING.duration;
  document.getElementById("fade").style.opacity = String(clamp((t - (D - .7)) / .6) + clamp(1 - t / .35));
}
window.init = (timing, m) => { TIMING = timing; MOUTH = m; SHOTS = null; };
window.renderAt = t => { render(t); return true; };
