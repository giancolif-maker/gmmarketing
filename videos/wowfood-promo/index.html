      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──

        tl.to("#el-06-logo", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 10);
        tl.fromTo("#el-07-four-minutes", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 10);

        tl.fromTo("#el-09-flavor-grid", { y: 1080, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.to("#el-10-whip-flavors", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 22);
        tl.fromTo("#el-11-stats", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 22);
        tl.to("#el-11-stats", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-12-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to({}, { duration: 29.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
