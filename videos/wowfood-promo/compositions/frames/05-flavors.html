  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      // panel layout in world space: z spacing 1500, alternating sides, angled toward center
      var P = [
        { x: -380, z: -600,  ry: 24 },
        { x:  380, z: -2100, ry: -24 },
        { x: -360, z: -3600, ry: 22 },
        { x:  360, z: -5100, ry: -22 },
        { x:    0, z: -6600, ry: 0 }
      ];
      var root = document.querySelector('[data-composition-id="05-flavors"]');
      var els = P.map(function (_, i) { return root.querySelector('#f05-p' + i); });
      var names = els.map(function (e) { return e.querySelector('.f05-name'); });
      var cam = { z: 0, ry: 0 };
      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function applyCamera() {
        for (var i = 0; i < P.length; i++) {
          var p = P[i], az = p.z + cam.z; // apparent depth
          var ry = p.ry * clamp(1 - (cam.z - 5000) / 1600, 0, 1) * (i === 4 ? 0 : 1);
          els[i].style.transform = 'translate3d(' + p.x + 'px,0px,' + az + 'px) rotateY(' + (p.ry) + 'deg)';
          // fog in from far, fade + streak-blur as it rushes past the lens
          var near = clamp((az + 300) / 1100, 0, 1);           // 0 at z<=-300, 1 at z>=800
          var far = clamp((az + 5200) / 2600, 0, 1);           // fades in from deep space
          var op = far * (1 - clamp((az - 650) / 250, 0, 1));
          var blur = (Math.pow(near, 2) * 18) + clamp((-az - 1500) / 2000, 0, 1) * 4;
          els[i].style.opacity = op.toFixed(3);
          els[i].style.filter = 'blur(' + blur.toFixed(2) + 'px)';
          // name glows while the panel is in its passing window
          var lit = clamp(1 - Math.abs(az + 150) / 650, 0, 1);
          if (i === 4) lit = clamp((az + 900) / 900, 0, 1);
          names[i].style.color = lit > 0.05 ? '#FFE9D6' : '#9A9089';
          names[i].style.opacity = (0.5 + 0.5 * lit).toFixed(3);
          names[i].style.textShadow = '0 0 ' + (8 + 30 * lit).toFixed(1) + 'px rgba(255,138,61,' + (0.9 * lit).toFixed(3) + '), 0 0 ' + (60 * lit).toFixed(1) + 'px rgba(206,89,9,' + (0.8 * lit).toFixed(3) + ')';
        }
      }
      applyCamera();
      var tl = gsap.timeline({ paused: true, onUpdate: applyCamera });
      // Scene 1-2: forward flight; panels pass at ~1.4 / 2.55 / 3.7 / 4.9s
      tl.fromTo(cam, { z: 0 }, { z: 6000, duration: 4.7, ease: 'none', onUpdate: applyCamera }, 0.2);

      window.__timelines["05-flavors"] = tl;
