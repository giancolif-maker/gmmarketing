<!doctype html>
<html><head><meta charset="UTF-8">
<style>
@font-face { font-family: Fraktur; src: url(assets/fonts/fraktur.ttf); }
@font-face { font-family: Fell; src: url(assets/fonts/fell.ttf); }
@font-face { font-family: FellSC; src: url(assets/fonts/fellsc.ttf); }
@font-face { font-family: Elite; src: url(assets/fonts/elite.ttf); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e9dcc0; }
#stage { position: absolute; inset: 0; filter: sepia(.18) saturate(.92) contrast(1.03); }
#stage svg, #paper { position: absolute; inset: 0; width: 1920px; height: 1080px; }
#paper { mix-blend-mode: multiply; pointer-events: none; }
#fade { position: absolute; inset: 0; background: #e6d6b4; opacity: 0; }
</style></head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- line boil: the displacement seed steps a few times a second so every ink line wobbles like hand-drawn cels -->
  <filter id="boil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="boilT" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="dof" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="9" stroke="#2a1c12" stroke-width="1.7"/></pattern>
  <pattern id="xhatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#2a1c12" stroke-width="1.5"/><line x1="0" y1="0" x2="10" y2="0" stroke="#2a1c12" stroke-width="1.1"/></pattern>
  <pattern id="damask" width="90" height="120" patternUnits="userSpaceOnUse">
    <rect width="90" height="120" fill="#b78a52"/>
    <path d="M45 14 C58 30 62 46 45 60 C28 46 32 30 45 14Z M45 60 C60 70 70 86 45 106 C20 86 30 70 45 60Z M0 60 C10 50 14 40 0 28 M90 60 C80 50 76 40 90 28" fill="#a7783f" stroke="#8f6331" stroke-width="2" opacity=".75"/>
    <circle cx="0" cy="0" r="6" fill="#a7783f"/><circle cx="90" cy="0" r="6" fill="#a7783f"/><circle cx="0" cy="120" r="6" fill="#a7783f"/><circle cx="90" cy="120" r="6" fill="#a7783f"/>
  </pattern>
  <pattern id="cobble" width="70" height="34" patternUnits="userSpaceOnUse">
    <rect width="70" height="34" fill="#7b6f63"/>
    <rect x="3" y="3" width="30" height="13" rx="6" fill="#8d8174" stroke="#2a1c12" stroke-width="2"/>
    <rect x="37" y="3" width="30" height="13" rx="6" fill="#857869" stroke="#2a1c12" stroke-width="2"/>
    <rect x="-15" y="19" width="30" height="13" rx="6" fill="#887b6d" stroke="#2a1c12" stroke-width="2"/>
    <rect x="20" y="19" width="30" height="13" rx="6" fill="#91857a" stroke="#2a1c12" stroke-width="2"/>
    <rect x="55" y="19" width="30" height="13" rx="6" fill="#887b6d" stroke="#2a1c12" stroke-width="2"/>
  </pattern>
  <radialGradient id="lampCone" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset=".6" stop-color="#ffcf7a" stop-opacity=".18"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="warmGlow"><stop offset="0" stop-color="#ffe7a8" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc66b" stop-opacity=".35"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/></radialGradient>
  <radialGradient id="roomDark" cx="46%" cy="48%" r="75%"><stop offset=".35" stop-color="#20120a" stop-opacity="0"/><stop offset="1" stop-color="#20120a" stop-opacity=".62"/></radialGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55657a"/><stop offset=".55" stop-color="#b9876a"/><stop offset="1" stop-color="#e6b06a"/></linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222c3d"/><stop offset=".7" stop-color="#4c5465"/><stop offset="1" stop-color="#7c6d5c"/></linearGradient>
  <linearGradient id="skyRuhr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5446"/><stop offset=".5" stop-color="#c47a45"/><stop offset="1" stop-color="#ebba70"/></linearGradient>
  <linearGradient id="winNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26324a"/><stop offset="1" stop-color="#4d5a70"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6326"/><stop offset=".35" stop-color="#e8c26a"/><stop offset=".6" stop-color="#b8892f"/><stop offset="1" stop-color="#6e4c1c"/></linearGradient>
  <linearGradient id="shadeGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e5a3c"/><stop offset="1" stop-color="#6f9064"/></linearGradient>
  <clipPath id="cWin"><rect x="150" y="190" width="370" height="440"/></clipPath>
  <clipPath id="cMirror"><ellipse cx="1010" cy="400" rx="118" ry="150"/></clipPath>
</defs>
<g id="world" filter="url(#boil)"></g>
<g id="hud"></g>
</svg>
<img id="paper" src="build/paper.png">
<div id="fade"></div>
</div>
<script src="lib/core.js"></script>
<script>
// ---------- the scene ----------
function lineAt(i) { return TIMING.lines[i]; }
function shots() {
  const L = TIMING.lines, D = TIMING.duration;
  const n = L[0].s, nEnd = L[0].e, dur = nEnd - n;
  return [
    { a: 0, b: n + dur * .26, name: "street" },
    { a: n + dur * .26, b: n + dur * .58, name: "ruhr" },
    { a: n + dur * .58, b: L[1].s - .25, name: "press" },
    { a: L[1].s - .25, b: L[2].s - .1, name: "wide" },
    { a: L[2].s - .1, b: L[3].s, name: "two" },
    { a: L[3].s, b: L[4].s, name: "board" },
    { a: L[4].s, b: L[5].s, name: "custCU" },
    { a: L[5].s, b: L[6].s, name: "waitCU" },
    { a: L[6].s, b: L[6].s + (L[6].e - L[6].s) * .55, name: "night" },
    { a: L[6].s + (L[6].e - L[6].s) * .55, b: D + 1, name: "book" },
  ];
}
let SHOTS = null;
function render(t) {
  if (!SHOTS) SHOTS = shots();
  const L = TIMING.lines;
  const sh = SHOTS.find(s => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1], u = t - sh.a, len = sh.b - sh.a;
  document.getElementById("boilT").setAttribute("seed", String(Math.floor(t * 8) % 4 + 1));
  let w = "", hud = "";
  const cust = { o: mouth("CUSTOMER", t), t }, wait = { o: mouth("WAITER", t), t };
  cust.shape = shapeAt(t, cust.o); wait.shape = shapeAt(t + .3, wait.o);
  cust.bl = blink(t, 11, SHOTS.map(s => s.a)); wait.bl = blink(t, 29);
  // customer drinking beat: during the waiter's "five thousand" he lifts the cup and gulps
  const d0 = L[2].s + .2, d1 = L[3].s + .1;
  const drink = t > d0 - .4 && t < d1 + .5 ? K(t, [[d0 - .4, 0], [d0 + .1, 1, "back"], [d1 - .3, 1], [d1 + .4, 0, "io"]]) : 0;
  const board = t < L[3].s + .15 ? { v0: "5.000", v1: "5.000", ft: 999 } : t < L[5].s + 1.2 ? { v0: "5.000", v1: "8.000", ft: L[3].s + .15 } : { v0: "8.000", v1: "11.000", ft: L[5].s + 1.25 };
  const custBase = () => {
    const outrage = t >= L[4].s - .05 && t < L[5].s + 1.4 ? K(t, [[L[4].s - .05, 0], [L[4].s + .12, 1, "back"], [L[4].e + .3, 1], [L[5].s + 1.4, .35, "io"]]) : t >= L[5].s + 1.4 ? .35 : 0;
    const talk = cust.o;
    return {
      x: 690, y: 770, o: cust.o, shape: cust.shape, bl: cust.bl, t,
      curve: outrage > .2 ? -4 : 3, brow: outrage * 1 + talk * .3, browK: -outrage * 1.2,
      look: drink > .5 ? [.3, -.2] : outrage > .2 ? [.8, -.1] : [.6, 0],
      hr: wob(t, 1, .7) * 2 - drink * 14 + outrage * 6, lean: wob(t, 2, .5) * 1.2 - drink * 5 + outrage * 3,
      sq: Math.sin(t * 2) * .1 + outrage * .6 - drink * .2 * Math.max(0, Math.sin((t - d0) * 9)), rise: outrage * .55,
      aR: drink > 0 ? [lerp(40, 70, drink), lerp(10, 148, drink)] : outrage > 0 ? [lerp(40, 140, outrage), lerp(10, -10, outrage)] : [40 + wob(t, 3, .4) * 3, 10],
      aL: outrage > 0 ? [lerp(15, 150, outrage), lerp(55, 20, outrage)] : [15, 55],
      cup: drink > 0, cupTilt: drink * -38,
      hat: t >= L[4].s ? K(t, [[L[4].s, 0], [L[4].s + .18, 1, "out"], [L[4].s + .5, .05, "in"], [L[4].s + .7, 0, "el"]]) : 0,
      hatR: t >= L[4].s && t < L[4].s + .7 ? Math.sin((t - L[4].s) * 20) * 12 * (1 - (t - L[4].s) / .7) : 0,
      lid: .12 - outrage * .12,
    };
  };
  const waitBase = () => {
    const smug = t >= L[5].s ? K(t, [[L[5].s, 0], [L[5].s + .5, 1], [L[5].e, 1], [L[5].e + .6, .6]]) : 0;
    const lean = t >= L[5].s ? K(t, [[L[5].s, 0], [L[5].s + .6, -7, "back"], [L[5].e + .2, -5], [L[5].e + .8, -1]]) : 0;
    const gest = t >= L[5].s + .25 && t < L[5].e + .6 ? K(t, [[L[5].s + .25, 0], [L[5].s + .6, 1, "back"], [L[5].e, 1], [L[5].e + .6, 0]]) : 0;
    const look = t > L[3].s && t < L[4].s ? [-.1, .5] : [-.7, 0];
    return {
      x: 1250, y: 1015, s: 1.02, o: wait.o, shape: wait.shape, bl: wait.bl, t,
      lid: t > L[3].s && t < L[4].s ? .6 : .45 - smug * .1 - (t > L[4].s && t < L[5].s ? .25 : 0), look,
      brow: smug * .8 + (t > L[4].s && t < L[5].s ? .5 : 0), browK: smug * .4, curve: smug * 5, skew: smug * 4,
      hr: wob(t, 5, .6) * 1.5 + smug * -5, lean: lean + wob(t, 7, .5) * .8, sq: Math.sin(t * 2.3 + 1) * .12 + (t > L[2].s && t < L[2].s + .25 ? .3 : 0),
      aF: gest > 0 ? [lerp(12, 60, gest), lerp(30, 109, gest)] : [12, 30], finger: gest > .5, fingerAng: Math.sin(t * 7) * 8 * gest,
      aB: [-60, -110],
    };
  };

  if (sh.name === "street") {
    CAM = K(u, [[0, [1000, 470, 1.05, 0]], [len, [960, 600, 1.32, 0], "io"]]);
    w += exterior(t, false);
    w += layer(1.5, `<g filter="url(#dof)">${litfass(180, 1140)}</g>`);
    w += roomGrade(.5);
  } else if (sh.name === "ruhr") {
    CAM = K(u, [[0, [820, 560, 1.15, -1]], [len, [1080, 520, 1.2, 1], "lin"]]);
    w += ruhr(t) + layer(1.25, poilu(1450, 1150, 1.05, t)) + roomGrade(.6);
  } else if (sh.name === "press") {
    const zoomT = L[0].e - 1.6 - sh.a;
    CAM = K(u, [[0, [980, 560, 1.0, 0]], [zoomT, [1180, 640, 1.12, 0], "lin"], [zoomT + .35, [1560, 760, 1.85, -3], "back"], [len, [1580, 760, 1.95, -3], "lin"]]);
    const [sx, sy] = shake(t, sh.a + zoomT, 7);
    CAM = [CAM[0] + sx, CAM[1] + sy, CAM[2], CAM[3]];
    w += press(t, u);
    let fly = ""; const r = rng(77);
    for (let i = 0; i < 14; i++) { const st = r() * len, p = ((u - st) / 2.2); if (p < 0 || p > 1) continue; fly += note(lerp(900 + r() * 400, -200 + r() * 2200, p), lerp(700, 1300, p * p) - Math.sin(p * 3) * 200, 220, 104, p * 400 * (r() - .5), i, "1.000.000", Math.cos(p * 9 + i)); }
    w += layer(1.4, `<g filter="url(#soft)">${fly}</g>`) + roomGrade(.7);
  } else if (["wide", "two", "board", "custCU", "waitCU"].includes(sh.name)) {
    const D = { board };
    if (sh.name === "wide") CAM = K(u, [[0, [930, 560, 1.0, 0]], [len, [950, 540, 1.06, 0], "lin"]]);
    if (sh.name === "two") CAM = K(u, [[0, [880, 520, 1.38, -1.5]], [len, [920, 500, 1.46, -1.5], "lin"]]);
    if (sh.name === "board") { CAM = K(u, [[0, [1610, 330, 2.5, 2]], [len, [1610, 320, 2.62, 2], "lin"]]); const [a, b] = shake(t, board.ft, 5); CAM = [CAM[0] + a, CAM[1] + b, CAM[2], CAM[3]]; }
    if (sh.name === "custCU") { CAM = K(u, [[0, [700, 430, 2.35, 5]], [.15, [690, 400, 2.15, 6], "back"], [len, [700, 395, 2.2, 6], "lin"]]); const [a, b] = shake(t, sh.a, 9, .4); CAM = [CAM[0] + a, CAM[1] + b, CAM[2], CAM[3]]; }
    if (sh.name === "waitCU") CAM = K(u, [[0, [1240, 560, 1.75, -3]], [len, [1250, 560, 1.95, -3], "lin"]]);
    w += cafe(t, D);
    let main = "";
    main += thonet(640, 792, 1) + customer(custBase());
    main += cafeFront(t) + saucer(860, 704);
    if (!custBase().cup) main += cupSvg(860, 702, 0, t < L[2].s ? 1 : .4, t);
    main += waiter(waitBase());
    w += layer(1, main);
    w += layer(1, `<rect x="0" y="0" width="1920" height="1080" fill="url(#lampCone)" opacity=".0"/><path d="M850,252 L990,252 L1300,1080 L540,1080Z" fill="url(#lampCone)" style="mix-blend-mode:screen" opacity=".55"/>`);
    w += layer(1.7, `<g filter="url(#dof)">${thonet(160, 940, 1.6)}<path d="M1760,1100 C1740,900 1820,820 1900,780 M1820,1100 C1820,960 1900,900 2000,880 M1700,1100 C1660,980 1690,900 1760,860" stroke="#2d3a24" stroke-width="40" fill="none" stroke-linecap="round"/></g>`);
    w += roomGrade(sh.name === "wide" ? .75 : .9);
  } else if (sh.name === "night") {
    CAM = K(u, [[0, [900, 560, 1.15, 0]], [len, [1000, 540, 1.05, 0], "lin"]]);
    w += exterior(t, true);
    // notes blow down the street; a boy flies a kite made of banknotes
    let blow = ""; const r = rng(4);
    for (let i = 0; i < 34; i++) { const sp = .25 + r() * .3, ph = r(), p = (u * sp + ph) % 1, yy = 700 + r() * 380; blow += note(lerp(-200, 2200, p), yy + Math.sin(p * 12 + i) * 40, 90, 44, p * 720 * (r() > .5 ? 1 : -1), i, "", Math.cos(p * 20 + i)); }
    let kid = `<g transform="translate(700 980)"><path d="M-14,0 L-10,-70 M14,0 L10,-70" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="M-24,-60 Q0,-140 24,-60Z" fill="#4b3b33" stroke="${INK}" stroke-width="3"/><circle cx="0" cy="-150" r="20" fill="#c9a07a" stroke="${INK}" stroke-width="3"/><path d="M-18,-160 Q0,-178 20,-160Z" fill="#3a3530" stroke="${INK}" stroke-width="3"/><path d="M10,-110 L60,-170" stroke="${INK}" stroke-width="10" stroke-linecap="round"/></g>`;
    const kx = 1080 + wob(t, 2, .8) * 30, ky = 330 + wob(t, 5, .7) * 25;
    let kite = `<path d="M760,810 Q${f1(kx - 160)},${f1(ky + 300)} ${f1(kx)},${f1(ky + 110)}" stroke="${INK}" stroke-width="3" fill="none"/><g transform="translate(${f1(kx)} ${f1(ky)}) rotate(${f1(wob(t, 1, 1.2) * 8)})">`;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) kite += note((i - 1) * 46 - (j - 1) * 46, (i + j - 2) * 38 + 0, 64, 32, 40, i + j * 3, "");
    kite += `<path d="M0,110 q-20,40 10,80 q30,40 -10,90" stroke="${INK}" stroke-width="3" fill="none"/></g>`;
    w += layer(1, kid + kite) + layer(1.3, `<g filter="url(#soft)">${blow}</g>`) + roomGrade(.8);
    const st = L[6].s + 2.45;
    if (t > st) {
      const p = clamp((t - st) / .16), sc = lerp(1.8, 1, E.out(p));
      const [a, b] = shake(t, st + .1, 8);
      hud += `<g transform="translate(${960 + a} ${300 + b}) rotate(-4) scale(${f1(sc)})" opacity="${f1(p)}"><rect x="-610" y="-92" width="1220" height="184" fill="#efe3c6" stroke="#8c2a1f" stroke-width="8"/><rect x="-596" y="-78" width="1192" height="156" fill="none" stroke="#8c2a1f" stroke-width="3"/>${tx(0, -18, 48, "1 DOLLAR =", "FellSC", "#8c2a1f", 'text-anchor="middle" letter-spacing="4"')}${tx(0, 54, 72, "4.200.000.000.000 MARK", "Elite", "#8c2a1f", 'text-anchor="middle"')}</g>`;
    }
  } else if (sh.name === "book") {
    CAM = K(u, [[0, [960, 560, 1.0, 0]], [len, [1000, 600, 1.22, 0], "lin"]]);
    let b = `<rect x="-400" y="-300" width="2800" height="1700" fill="#4a3424"/><rect x="-400" y="-300" width="2800" height="1700" fill="url(#hatch)" opacity=".18"/>`;
    b += S("M380,880 L560,300 L1100,330 L1060,920Z", "#e8dfc8", 6) + S("M1060,920 L1100,330 L1620,280 L1700,860Z", "#ece4ce", 6);
    b += `<path d="M1060,920 L1100,330" stroke="${INK}" stroke-width="8"/>` + tx(800, 400, 44, "Sparbuch", "Fraktur", "#3d2a18", 'text-anchor="middle" transform="rotate(4 800 400)"');
    const rows = [["1913", "Einlage", "20.000"], ["1918", "Zinsen", "+ 1.840"], ["1921", "Einlage", "+ 5.000"], ["1923", "Guthaben", "26.840 M"]];
    rows.forEach(([y, l, v], i) => { b += `<g transform="rotate(${-3 + i * .2} 1360 500)">${tx(1170, 470 + i * 80, 34, y, "Elite", "#3d2a18")}${tx(1280, 470 + i * 80, 34, l, "Fell", "#3d2a18")}${tx(1600, 470 + i * 80, 34, v, "Elite", i === 3 ? "#8c2a1f" : "#3d2a18", 'text-anchor="end"')}<path d="M1160,${484 + i * 80} L1610,${470 + i * 80}" stroke="#a89878" stroke-width="2"/></g>`; });
    const ink = clamp((u - 1.1) / .6);
    b += `<g transform="rotate(-8 1380 700)" opacity="${f1(ink)}">${tx(1390, 760, 52, "wertlos", "Fraktur", "#8c2a1f", 'text-anchor="middle"')}<path d="M1240,${712} L1550,700" stroke="#8c2a1f" stroke-width="5"/></g>`;
    b += tx(790, 520, 30, "Sparkasse der Stadt Berlin", "Fell", "#3d2a18", 'text-anchor="middle" transform="rotate(4 800 520)"') + tx(790, 640, 40, "Herrn Bruno Brandt", "Fell", "#3d2a18", 'text-anchor="middle" font-style="italic" transform="rotate(4 800 640)"') + `<circle cx="760" cy="780" r="62" fill="none" stroke="#8c2a1f" stroke-width="5" opacity=".7"/>` + tx(760, 792, 24, "SPARKASSE", "FellSC", "#8c2a1f", 'text-anchor="middle" opacity=".7"');
    b += `<g transform="translate(330 1010) scale(2.2)">${saucer(0, 2)}${cupSvg(0, 0, 0, 0, t)}</g>`;
    b += `<circle cx="1000" cy="200" r="${f1(400 - u * 50)}" fill="url(#warmGlow)" opacity="${f1(.6 - u * .12)}" style="mix-blend-mode:screen"/>`;
    w += layer(1, b) + roomGrade(.9 + u * .05);
  }
  // date card on the street establishing shot
  if (sh.name === "street" && u > .5) {
    const p = clamp((u - .5) / .14), sc = lerp(1.9, 1, E.out(p)), [a, b] = shake(t, .6, 8);
    hud += `<g transform="translate(${1450 + a} ${180 + b}) rotate(-6) scale(${f1(sc)})" opacity="${f1(p * .92)}"><rect x="-260" y="-80" width="520" height="160" fill="none" stroke="#8c2a1f" stroke-width="9"/>${tx(0, -8, 46, "BERLIN", "FellSC", "#8c2a1f", 'text-anchor="middle" letter-spacing="10"')}${tx(0, 56, 58, "1923", "Elite", "#8c2a1f", 'text-anchor="middle" letter-spacing="8"')}</g>`;
  }
  if (sh.name === "ruhr" && u > .3) {
    const p = clamp((u - .3) / .14), sc = lerp(1.8, 1, E.out(p));
    hud += `<g transform="translate(420 170) rotate(4) scale(${f1(sc)})" opacity="${f1(p * .92)}"><rect x="-290" y="-70" width="580" height="140" fill="none" stroke="#8c2a1f" stroke-width="8"/>${tx(0, -6, 40, "THE RUHR", "FellSC", "#8c2a1f", 'text-anchor="middle" letter-spacing="8"')}${tx(0, 46, 32, "French occupation · January 1923", "Fell", "#8c2a1f", 'text-anchor="middle"')}</g>`;
  }
  document.getElementById("world").innerHTML = w;
  document.getElementById("hud").innerHTML = hud;
  const D = TIMING.duration;
  document.getElementById("fade").style.opacity = String(clamp((t - (D - .7)) / .6) + clamp(1 - t / .35));
}
window.init = (timing, m) => { TIMING = timing; MOUTH = m; SHOTS = null; };
window.renderAt = t => { render(t); return true; };
</script>
