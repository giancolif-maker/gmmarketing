<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #E7D8C3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-tease"
        class="scene"
        data-composition-id="01-tease"
        data-composition-src="compositions/frames/01-tease.html"
        data-start="0"
        data-duration="4.6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-macro"
        class="scene"
        data-composition-id="02-macro"
        data-composition-src="compositions/frames/02-macro.html"
        data-start="4"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-introducing"
        class="scene"
        data-composition-id="03-introducing"
        data-composition-src="compositions/frames/03-introducing.html"
        data-start="9.5"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-four-minutes"
        class="scene"
        data-composition-id="04-four-minutes"
        data-composition-src="compositions/frames/04-four-minutes.html"
        data-start="13.5"
        data-duration="6.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-flavors"
        class="scene"
        data-composition-id="05-flavors"
        data-composition-src="compositions/frames/05-flavors.html"
        data-start="19.5"
        data-duration="6.6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-now-in-stores"
        class="scene"
        data-composition-id="06-now-in-stores"
        data-composition-src="compositions/frames/06-now-in-stores.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-tease", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-macro", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 4);
        tl.to("#el-03-introducing", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 13.5);
        tl.fromTo("#el-04-four-minutes", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 13.5);
        tl.to("#el-04-four-minutes", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 19.5);
        tl.fromTo("#el-05-flavors", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 19.5);
        tl.to("#el-05-flavors", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.fromTo("#el-06-now-in-stores", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 25.5);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
